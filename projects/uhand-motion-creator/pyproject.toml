[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "uhand-motion-creator"
version = "1.0.0"
description = "Windows uHand motion editor and Python code generator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["uhand-about==0.1.1", "uhand-model==0.1.3", "uhand-client-module>=1.0.0,<2.0.0", "PySide6-Essentials==6.12.0", "vispy==0.17.0", "numpy==2.5.5"]
classifiers = ["Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]
[project.gui-scripts]
uhand-motion-creator = "uhand_motion_creator.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
