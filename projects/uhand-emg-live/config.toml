# uHandEmgLive 설정. 고친 뒤 프로그램을 다시 시작하면 적용됩니다.
# 이 파일이 없거나 항목이 빠져 있으면 src/uhand_emg_live/config.py 의 기본값을 씁니다.

[sensor]
port = "auto"            # "auto" = CH340 수신기를 찾아 연결, 또는 "COM4" 처럼 지정

[robot]
virtual = "127.0.0.1:5000"       # uHandVirtualServer (같은 PC)
real = "192.168.61.1:5000"       # 실물 로봇손 (Ethernet)
step_ms = 250                    # 한 번 움직이는 시간. 로봇손의 최소 동작 시간이 250 ms
predict_ms = 250                 # 몇 ms 뒤의 자세를 미리 보낼지 (0 = 예측 없음). 화면에서도 바꿀 수 있음
deadband = 10                    # 모든 축의 변화가 이 값(펄스)보다 작으면 보내지 않음

[motion]
# 축마다 위치·속도를 추적하는 칼만 필터. 단위는 축 범위를 -1..1 로 본 값.
accel = 12.0             # 클수록 빠르게 따라가고 더 떨림
noise = 0.5              # 클수록 측정을 덜 믿어 부드럽고 느림 (확신이 낮을 때는 자동으로 더 커짐)
# 녹화 4개로 잰 값 (동작 시작 뒤 새 자세의 90%에 닿는 시간 / 유지 중 떨림):
#   칼만 없이 모델의 평활 확률 그대로   0.74초 / 17
#   accel 12, noise 0.5, 예측 250 ms     0.56초 / 38   (기본값)
#   accel 6,  noise 1.0, 예측 250 ms     0.78초 / 17
#   accel 25, noise 0.25, 예측 250 ms    0.44초 / 67
sharpen = 2.0            # 확률로 자세를 섞을 때 1등 동작 쪽으로 쏠리게 하는 정도 (1 = 확률 그대로)

[decide]
# 화면의 "확정 동작"이 바뀌는 조건: 새 동작이 min_prob 이상으로 hold 회(0.1초 간격) 연속
min_prob = 0.6
hold = 3

# 인형극 모드: 확정된 동작에 해당하는 공연 파일(uHandMotionCreator 로 만든 .uhjson)을 반복 재생합니다.
[theater]
folder = "sequences"     # 공연 파일을 넣는 폴더 (이 파일 기준 상대 경로). 안의 폴더 하나가 화면에서 고르는 공연 세트 하나
library = "../uhand-motion-creator/examples/sequences"  # 화면에서 동작마다 골라 쓸 수 있는 공연 파일이 모여 있는 폴더 (없어도 됨)
led = true               # false 이면 장면의 LED 카드를 건너뜀
buzzer = true            # false 이면 소리는 내지 않고 시간만 지킴

# 동작 → 파일 번호. 영동 님 프로그램(EMGRobotHandTheater)의 번호표와 같습니다.
# 예: 주먹(fist) = 6 → sequences/action_06.uhjson
[theater.ids]
rest = 0
index = 1
radial_dev = 2
wrist_ext = 3
wrist_flex = 4
open = 5
fist = 6
ulnar_dev = 7

[health]
stall_s = 0.5            # 이 시간 동안 수신이 없으면 "신호 없음" (로봇 정지)
min_rate = 450           # HEX 모드 수신 샘플률(Hz)이 이보다 낮으면 주의
battery_warn = 20        # 배터리(%)가 이보다 낮으면 주의
flat_std = 0.3           # 채널 표준편차가 이보다 작은 상태가 flat_s 초 이어지고, 그동안 다른 채널은 움직였으면 "평탄"
flat_s = 15
saturated = 0.2          # 최근 1초의 0 또는 255 근처 샘플 비율이 이보다 크면 "포화"
offset = 40              # 채널 중앙값이 127에서 이만큼 벗어나면 "오프셋"

# 동작별 로봇 자세: [엄지, 검지, 중지, 약지, 소지, 손목] 서보 펄스.
#   손가락 2~5: 800 = 굽힘, 2000 = 폄      엄지: 2200 = 굽힘, 800 = 폄 (영동 님 프로그램의 누락 표시 동작에서 추정)
#   손목: 500..2500 회전, 1500 = 가운데
# 로봇에는 손목 회전 1축뿐이라 손목 동작 4개는 임시 자세입니다. 실물을 보며 고치세요.
[poses]
home       = [1500, 1500, 1500, 1500, 1500, 1500]
rest       = [1500, 1500, 1500, 1500, 1500, 1500]
fist       = [2200,  800,  800,  800,  800, 1500]
open       = [ 800, 2000, 2000, 2000, 2000, 1500]
index      = [2200, 2000,  800,  800,  800, 1500]
wrist_flex = [1500, 1100, 1100, 1100, 1100, 1500]
wrist_ext  = [1100, 1850, 1850, 1850, 1850, 1500]
radial_dev = [1500, 1500, 1500, 1500, 1500, 2200]
ulnar_dev  = [1500, 1500, 1500, 1500, 1500,  800]
# 기본(가위바위보·숫자) 세트 모델용
rock       = [2200,  800,  800,  800,  800, 1500]
paper      = [ 800, 2000, 2000, 2000, 2000, 1500]
scissors   = [2200, 2000, 2000,  800,  800, 1500]
one        = [2200, 2000,  800,  800,  800, 1500]
two        = [2200, 2000, 2000,  800,  800, 1500]
three      = [2200, 2000, 2000, 2000,  800, 1500]
four       = [2200, 2000, 2000, 2000, 2000, 1500]
five       = [ 800, 2000, 2000, 2000, 2000, 1500]
