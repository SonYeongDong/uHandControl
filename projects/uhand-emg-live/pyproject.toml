[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uhand-emg-live"
version = "1.0.1"
description = "EMG armband gestures driving the uHand, shown stage by stage in a Light Studio interface"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["uhand-client-module==1.0.1", "uhand-about==0.1.1", "uhand-model==0.1.3", "PySide6-Essentials==6.12.0", "vispy==0.17.0", "numpy==2.5.5", "scipy>=1.15", "pyqtgraph>=0.13.7", "pyserial>=3.5", "scikit-learn>=1.6", "joblib>=1.3"]
classifiers = ["Operating System :: Microsoft :: Windows", "Operating System :: MacOS :: MacOS X", "Programming Language :: Python :: 3"]

[project.gui-scripts]
uhand-emg-live = "uhand_emg_live.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uhand_emg_live = ["uHandEmgLive.ico"]
