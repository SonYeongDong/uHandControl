[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "uhand-model"
version = "0.1.3"
description = "Shared uHand procedural geometry and YAW mapping"
requires-python = ">=3.13"
dependencies = ["numpy==2.5.5"]
[tool.setuptools.packages.find]
where = ["src"]
