[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uhand-desktop-audio"
version = "0.1.0"
description = "macOS PCM output for the uHand desktop applications"
requires-python = ">=3.13"
dependencies = ["pygame-ce==2.5.8; sys_platform == 'darwin'"]

[tool.setuptools.packages.find]
where = ["src"]
